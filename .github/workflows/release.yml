name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.2.0
        required: true

permissions:
  contents: write

jobs:
  # Keeps a release pull request open from the Conventional Commits on main. Merging it publishes the release.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  windows:
    needs: release-please
    # A release made with the workflow token starts no other workflow, so the build is a job of this one.
    if: always() && (needs.release-please.outputs.released == 'true' || github.event_name != 'push')
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag || github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version like v1.2.0 or v1.2.0-beta.1"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Apply version
        shell: bash
        run: |
          npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version
          node -e "const f='extension/manifest.json',fs=require('fs'),m=JSON.parse(fs.readFileSync(f));m.version='${{ steps.version.outputs.value }}'.split('-')[0];fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n')"

      - run: npm run typecheck

      - run: npm run build

      - name: Package
        run: npx electron-builder --win --publish never

      - name: Zip browser extension
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath "dist/FiveM-Portal-Push-Connector-${{ steps.version.outputs.value }}.zip"

      - name: Upload to release
        shell: bash
        run: |
          gh release upload "$TAG" \
            dist/FiveM-Portal-Push-Setup-*.exe \
            dist/FiveM-Portal-Push-Setup-*.exe.blockmap \
            dist/FiveM-Portal-Push-*-portable.exe \
            dist/FiveM-Portal-Push-Connector-*.zip \
            --clobber
          # Last, so the app never sees an update whose installer is not there yet.
          gh release upload "$TAG" dist/latest.yml --clobber
