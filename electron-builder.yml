appId: com.fivem.portalpush
productName: FiveM Portal Push
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: extension
    to: extension
publish:
  provider: github
  owner: TGIANN
  repo: fivem-portal-push
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: FiveM-Portal-Push-Setup-${version}.${ext}
portable:
  artifactName: FiveM-Portal-Push-${version}-portable.${ext}
